services:
  # ─── web: FastAPI backend + React/Vite frontend ───────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://app:apppassword@db:3306/outdoor_hounds
      LLM_ENABLED: "false"
      LLM_PROVIDER: mock
      LLM_MODEL: mock-model-v1
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        until python -c \"import pymysql; pymysql.connect(host='db', user='app', password='apppassword', database='outdoor_hounds', port=3306).close()\"; do
          echo 'Waiting for MySQL...';
          sleep 3;
        done;
        uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
      "

  # ─── db: MySQL shared database ────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: outdoor_hounds
      MYSQL_USER: app
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── mobile-api: Express/tRPC API for the mobile app ──────────────────────
  # Only started with: docker compose --profile mobile up
  mobile-api:
    profiles: ["mobile"]
    build:
      context: ./mobile
      dockerfile: Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://app:apppassword@db:3306/outdoor_hounds
      JWT_SECRET: change-me-in-production
      VITE_APP_ID: ""
      OAUTH_SERVER_URL: ""
      OWNER_OPEN_ID: ""
      BUILT_IN_FORGE_API_URL: ""
      BUILT_IN_FORGE_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

  # ─── mobile-web: Expo web export served by nginx ──────────────────────────
  # Only started with: docker compose --profile mobile up
  mobile-web:
    profiles: ["mobile"]
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_BASE_URL: http://localhost:3000
        EXPO_PUBLIC_APP_ID: ""
        EXPO_PUBLIC_OAUTH_SERVER_URL: ""
        EXPO_PUBLIC_OAUTH_PORTAL_URL: ""
        EXPO_PUBLIC_OWNER_OPEN_ID: ""
        EXPO_PUBLIC_OWNER_NAME: ""
    ports:
      - "8081:80"
    depends_on:
      mobile-api:
        condition: service_started

volumes:
  db-data:
