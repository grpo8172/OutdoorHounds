server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api to the mobile-api backend so the browser only ever talks to
    # this origin — required so the session cookie is first-party. Without
    # this, the app called mobile-api's own domain directly (cross-site),
    # which Safari's Intelligent Tracking Prevention can reject regardless of
    # SameSite/Secure cookie settings. __MOBILE_API_ORIGIN__ (full origin,
    # e.g. https://mobile-api-xxx.run.app or http://mobile-api:3000 for local
    # docker-compose) is substituted at image build time — see Dockerfile.web.
    location /api/ {
        proxy_pass __MOBILE_API_ORIGIN__;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Content-hashed static assets (e.g. /_expo/static/js/web/entry-XXXX.js) are
    # safe to cache forever — a new build always produces a new filename.
    location ~* ^/_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Dynamic routes' static export (`expo export --platform web`) produces
    # one shared template file per route PATTERN (e.g. t/[slug].html), since
    # the actual param value is unknown at build time. Without these rules,
    # a fresh/direct visit to e.g. /t/<slug> falls through to the generic
    # `location /` block below, which serves index.html — the DEFAULT
    # route's own fully pre-rendered HTML (baked in at build time). Because
    # the served page sets `__EXPO_ROUTER_HYDRATE__=true`, the client trusts
    # that HTML matches the current URL rather than re-resolving from
    # scratch, so it was rendering the default Home screen forever and never
    # actually booting the dynamic screen — a real bug, not just a missing
    # cache-bust. Each of these was previously only ever reached via in-app
    # client-side navigation (already-hydrated, no fresh page load), which
    # is why this went unnoticed until a direct shareable link exposed it.
    location ~ ^/t/[^/]+/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files "/t/[slug].html" /index.html;
    }
    location ~ ^/discover/[^/]+/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files "/discover/[mode].html" /index.html;
    }
    location ~ ^/chat/[^/]+/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files "/chat/[conversationId].html" /index.html;
    }

    # index.html (and the SPA fallback for client-side routes) must never be
    # cached, or browsers/proxies can keep serving a stale build — pointing at
    # an old, already-replaced asset hash — indefinitely, surviving even a
    # hard refresh.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
